baseURL = "https://noaware.io/"
# Hugo 0.158+ replaced languageCode with locale (languageCode now logs a deprecation
# warning, and the build must stay warning-free).
locale = "en-au"
title = "Mono No Aware Studios"
enableRobotsTXT = true
disableHugoGeneratorInject = true
disableKinds = ["taxonomy", "term", "RSS"]

[params]
  description = "Mono No Aware Studios, Melbourne. Hold Tight, a narrative puzzle game in development on Unreal Engine 5. Music by Daniel Kleviansky on Spotify and Apple Music."
  email = "contact@noaware.io"

  [params.links]
    # The studio's LinkedIn Page (not a personal profile).
    linkedin = "https://www.linkedin.com/company/noaware/"
    spotify = "https://open.spotify.com/artist/33gK9iubv5jGA9Gg27wIkY"
    apple = "https://music.apple.com/au/artist/daniel-kleviansky/1510186994"

[minify]
  disableXML = true
  [minify.tdewolff.html]
    keepComments = false
    keepDefaultAttrVals = true
    keepDocumentTags = true
    keepEndTags = true
    keepQuotes = true
    keepWhitespace = false
  [minify.tdewolff.css]
    precision = 0
