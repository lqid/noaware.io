<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<!-- Like the studio page, this makes no third-party requests. Unlike it, it runs scripts (its own
     files only) and sets inline style attributes, which the app uses for its note colors.
     GitHub Pages cannot set headers, so the policy is a meta tag. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tone Ladder · Mono No Aware Studios</title>
<meta name="description" content="Tone Ladder, an ear-training course for composers: scale degrees, intervals, chords, harmony, melodic dictation, rhythm and singing.">
<!-- Unlisted: not linked from the studio page and kept out of search results. -->
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F3EFE7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151310" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/fonts/instrument-sans-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/cormorant-garamond-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="studio.css">
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <button class="brand" data-act="go" data-view="today" aria-label="Tone Ladder, today">
      <span class="brand-mark" aria-hidden="true"><i style="--h:305"></i><i style="--h:255"></i><i style="--h:195"></i><i style="--h:145"></i><i style="--h:92"></i><i style="--h:58"></i><i style="--h:25"></i></span>
      <span class="brand-name">Tone Ladder</span>
    </button>
    <nav class="nav" id="nav" aria-label="Main">
      <button data-act="go" data-view="today"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 16V4M16 16V4M4 7h12M4 11h12M4 15h12"/></svg><span>Today</span></button>
      <button data-act="go" data-view="explore"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="2.5" y="4" width="15" height="12" rx="1.5"/><path d="M6.5 4v7M10 4v7M13.5 4v7"/></svg><span>Explore</span></button>
      <button data-act="go" data-view="progress"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 16.5h14M5.5 14V9M10 14V5M14.5 14v-3"/></svg><span>Progress</span></button>
      <button data-act="go" data-view="method"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 4.5c2.5-1 4.8-.8 7 .8 2.2-1.6 4.5-1.8 7-.8v11c-2.5-1-4.8-.8-7 .8-2.2-1.6-4.5-1.8-7-.8z"/><path d="M10 5.3v11"/></svg><span>Method</span></button>
      <button data-act="go" data-view="prefs"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 5h12M4 10h12M4 15h12"/><circle cx="7" cy="5" r="1.8" fill="var(--bg)"/><circle cx="13" cy="10" r="1.8" fill="var(--bg)"/><circle cx="8" cy="15" r="1.8" fill="var(--bg)"/></svg><span>Preferences</span></button>
    </nav>
  </header>
  <main id="view" tabindex="-1"></main>
  <!-- site-only -->
  <footer class="studio-foot">Made by <a href="/">Mono No Aware Studios</a>, Melbourne.</footer>
  <!-- /site-only -->
</div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script src="js/theory.js"></script>
<script src="js/audio.js"></script>
<script src="js/curriculum.js"></script>
<script src="js/store.js"></script>
<script src="js/pitch.js"></script>
<script src="js/take.js"></script>
<script src="js/app.js"></script>
</body>
</html>
