{{ define "main" }}
<section class="container hero hero--404" aria-labelledby="nf-title">
{{- $nf := site.Home.Params.notfound }}
  <p class="label">{{ $nf.label }}</p>
  <h1 id="nf-title" class="serif">{{ $nf.heading }}</h1>
  <p class="hero-sub">{{ $nf.text }} <a href="{{ site.Home.RelPermalink }}">{{ $nf.link }}</a>.</p>
</section>
<div class="rule" aria-hidden="true"></div>
{{ end }}
